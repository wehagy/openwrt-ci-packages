# Responsibility: the data of the package netbird that the caller workflow
# (.github/workflows/ci.yml) reads. The base (wehagy/openwrt-ci) needs nothing
# else: the package is built from openwrt/packages and tested by the generic
# package test; package-specific tests, when they exist, go in
# packages/netbird/tests (see README.md).
#
# Keys:
#   package       name of the package, a directory of openwrt/packages
#   test_secrets  optional; names of the secrets its tests receive (space or
#                 comma separated), read by upstream-pr.yml; ci.yml names the
#                 same ones in its own test_secrets
package: netbird
test_secrets: NB_SETUP_KEY
