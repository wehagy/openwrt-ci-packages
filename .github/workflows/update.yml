# A new upstream NetBird release becomes a DRAFT pull request for manual review.
#
# Every day (and on request) it compares the latest release of netbirdio/netbird
# with PKG_VERSION in the review repository (packages/netbird/config.yml,
# review_repository). When the release is newer and no branch or pull request
# for it exists there:
#   1. prepare: commit "netbird: update to X.Y.Z" on the review branch and push
#      two branches to the review repository, base (the starting commit) and
#      update (the commit), so that a pull request between them shows only the
#      bump;
#   2. build, QEMU-test and build images on every line of the package (`lines:`
#      of its config.yml; no line is named in this file), in parallel, one leg
#      of a matrix each (line.yml), through the reusable base
#      wehagy/openwrt-ci (feed_repository/feed_ref). The reference line (the
#      line of the base whose packages_branch is master) builds the update
#      branch as it is. Every other line builds its own packages_branch of
#      openwrt/packages with only the bumped package directory (package_path)
#      of the update branch laid over it (job compose, the overlay of
#      upstream-pr.yml), so it checks the bump as a backport and not master's
#      whole feed against that line's SDK;
#   3. publish: when the reference line passed (the other lines may fail), open
#      a draft pull request between the two branches with the results of every
#      line and the link that opens the upstream pull request by hand;
#      otherwise delete both branches. CI never writes to openwrt/packages.
#      The result of each line is read from its artifact line-result-<package>-
#      <line> (scripts/line-result.sh), not from `needs`: the `needs` of a
#      matrix job is one aggregate of all its legs.
#
# Failure paths: a run that pushed its branches and then fails or is cancelled
# deletes them (prepare and publish, see the cleanup steps). A forced
# cancellation or a lost runner cannot; the next run's detect job then fails
# with ::error:: on the orphan branches and says how to remove them. The
# overlay branches of the other lines (upstream-overlay/ in THIS repository,
# one per line) are deleted by the job cleanup on every path once the lines are
# done; the ones a killed run leaves are deleted by the job sweep of a later
# run, once older than a day.
#
# The secret TEST_UPSTREAM_TOKEN (fine-grained token, only the review
# repository, Contents and Pull requests: write) is an environment secret of
# the environment `review`; only prepare and publish declare it. `secrets:
# inherit` passes no environment secret, so the test jobs (secrets: inherit and
# test_secrets: NB_SETUP_KEY) never see the token. A job that runs package code
# must never declare `environment: review`. compose and cleanup push and delete
# a branch of this repository with the GITHUB_TOKEN (contents: write on those
# two jobs only); they use no secret and run no package code.
#
# The workflows and the scripts of the base both come from its main (`@main` and
# ci_ref: main, in line.yml; ci_ref defaults to main, it is kept explicit to match
# `@main`).
name: update

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: Bump to this version (X.Y.Z) instead of the latest release
        type: string
        default: ""

permissions:
  contents: read

# One update run at a time. A second run (the schedule and a manual dispatch)
# would race the first on the same two branches, and its cleanup could delete
# the branches of the run still using them. A queued run waits (nothing is
# cancelled); GitHub keeps one pending run per group, a newer one replaces it.
concurrency:
  group: update-netbird
  cancel-in-progress: false

env:
  COMMIT_NAME: Wesley Gimenes
  COMMIT_EMAIL: wehagy@proton.me
  # The branch of this repository that carries the tree of a line other than the
  # reference is ${OVERLAY_PREFIX}-<line>; known here so that compose and
  # cleanup agree on it even when compose fails.
  OVERLAY_PREFIX: upstream-overlay/update-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  # Reads the one configuration file, validates it, runs the self-tests of the
  # scripts and decides whether there is anything to do. Read only.
  detect:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    outputs:
      package: ${{ steps.config.outputs.package }}
      package_path: ${{ steps.config.outputs.package_path }}
      upstream_repository: ${{ steps.config.outputs.upstream_repository }}
      review_repository: ${{ steps.config.outputs.review_repository }}
      review_branch: ${{ steps.config.outputs.review_branch }}
      needed: ${{ steps.plan.outputs.needed }}
      current: ${{ steps.plan.outputs.current }}
      target: ${{ steps.plan.outputs.target }}
      update_branch: ${{ steps.plan.outputs.update_branch }}
      base_branch: ${{ steps.plan.outputs.base_branch }}
      review_is_fork: ${{ steps.fork.outputs.review_is_fork }}
      profiles: ${{ steps.images.outputs.profiles }}
      packages: ${{ steps.images.outputs.packages }}
      targets: ${{ steps.images.outputs.targets }}
      memory: ${{ steps.images.outputs.memory }}
      apk_timeout: ${{ steps.images.outputs.apk_timeout }}
      services_disabled: ${{ steps.images.outputs.services_disabled }}
      upstream_base: ${{ steps.upstream_base.outputs.upstream_base }}
      lines: ${{ steps.images.outputs.lines }}
      reference: ${{ steps.images.outputs.reference }}
      others: ${{ steps.images.outputs.others }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # The lines of the base (harness/lines.yml): the lines of the config are
      # checked against it.
      - name: Check out the base (its lines)
        uses: actions/checkout@v7.0.1
        with:
          repository: wehagy/openwrt-ci
          ref: main
          path: ci-base
          persist-credentials: false

      - name: Self-test the scripts
        run: |
          scripts/images/selftest.sh
          scripts/update-selftest.sh
          python3 -B scripts/report_selftest.py

      # review_repository is validated here: the owner openwrt is refused.
      - name: Read and validate packages/netbird/config.yml
        id: config
        run: scripts/check-config.sh packages/netbird/config.yml | tee -a "${GITHUB_OUTPUT}"

      # What is built, tested and imaged: the same reader and the same file as
      # ci.yml, so a bump is checked on the images and with the VM settings
      # that ci.yml uses.
      - name: Read the image and test settings of packages/netbird/config.yml
        id: images
        run: scripts/images/config.sh netbird | tee -a "${GITHUB_OUTPUT}"

      - name: Plan the update
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_REPOSITORY: ${{ steps.config.outputs.upstream_repository }}
          REVIEW_REPOSITORY: ${{ steps.config.outputs.review_repository }}
          REVIEW_BRANCH: ${{ steps.config.outputs.review_branch }}
          PACKAGE: ${{ steps.config.outputs.package }}
          PACKAGE_PATH: ${{ steps.config.outputs.package_path }}
          FORCE_VERSION: ${{ inputs.version }}
        run: scripts/plan-update.sh | tee -a "${GITHUB_OUTPUT}"

      # A fork gets the working upstream link; a copy that is not a fork (the
      # test repository) gets a note that the link does not work.
      - name: Is the review repository a fork
        id: fork
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_REPOSITORY: ${{ steps.config.outputs.review_repository }}
        run: |
          fork=$(gh api "repos/${REVIEW_REPOSITORY}" --jq .fork)
          case "${fork}" in true | false) ;; *) echo "::error::cannot tell if the review repository is a fork"; exit 1 ;; esac
          echo "review_is_fork=${fork}" | tee -a "${GITHUB_OUTPUT}"

      # Production guard, before anything is pushed: a fork must not carry
      # commits that openwrt/packages master lacks (the upstream pull request
      # would carry them); the base commit goes into the description. The test
      # copy, not a fork, only gets its note.
      - name: Check the base against openwrt/packages master
        id: upstream_base
        if: ${{ steps.plan.outputs.needed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_REPOSITORY: ${{ steps.config.outputs.review_repository }}
          REVIEW_BRANCH: ${{ steps.config.outputs.review_branch }}
          REVIEW_IS_FORK: ${{ steps.fork.outputs.review_is_fork }}
        run: scripts/check-fork-base.sh | tee -a "${GITHUB_OUTPUT}"

      - name: Summary
        env:
          NEEDED: ${{ steps.plan.outputs.needed }}
          REASON: ${{ steps.plan.outputs.reason }}
          REVIEW_REPOSITORY: ${{ steps.config.outputs.review_repository }}
        run: |
          {
            echo "### Update plan"
            echo
            echo "- review repository: \`${REVIEW_REPOSITORY}\`"
            echo "- update needed: \`${NEEDED}\`"
            echo "- ${REASON}"
          } | tee -a "${GITHUB_STEP_SUMMARY}"

  # Deletes the overlay branches (upstream-overlay/update-*) older than a day,
  # which a killed run left behind: cleanup cannot run in a run that dies. A
  # younger branch may be in use and stays. It does not depend on any other job
  # and none depends on it. contents: write, the GITHUB_TOKEN, no secret, no
  # package code.
  sweep:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Delete the stale overlay branches
        env:
          GH_TOKEN: ${{ github.token }}
          MAX_AGE_HOURS: "24"
        run: scripts/upstream-pr/sweep.sh

  # The first job with the token: commit the bump and push the two branches. It
  # runs before the build because the base builds a commit of the review
  # repository (feed_ref), which must exist there. It fails before any build if
  # the secret is missing.
  prepare:
    needs: detect
    if: ${{ needs.detect.outputs.needed == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    environment: review
    defaults:
      run:
        shell: bash
    outputs:
      base_sha: ${{ steps.branches.outputs.base_sha }}
      sha: ${{ steps.branches.outputs.sha }}
    env:
      REVIEW_REPOSITORY: ${{ needs.detect.outputs.review_repository }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Check the configuration and the token
        env:
          TEST_UPSTREAM_TOKEN: ${{ secrets.TEST_UPSTREAM_TOKEN }}
          GH_TOKEN: ${{ secrets.TEST_UPSTREAM_TOKEN }}
          REVIEW_BRANCH: ${{ needs.detect.outputs.review_branch }}
        run: |
          configured=$(scripts/check-config.sh packages/netbird/config.yml | grep '^review_repository=')
          if [ "${configured}" != "review_repository=${REVIEW_REPOSITORY}" ]; then
            echo "::error::review_repository changed since the detect job"
            exit 1
          fi
          if [ -z "${TEST_UPSTREAM_TOKEN}" ]; then
            echo "::error::the secret TEST_UPSTREAM_TOKEN is not set in the environment review: create a fine-grained token (owner wehagy, only the review repository, Contents and Pull requests: read and write) and store it as that environment secret"
            exit 1
          fi
          # Push and pull request rights, the latter by a probe that cannot
          # create a pull request (scripts/check-token.sh).
          PROBE_HEAD="ci/token-probe-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" scripts/check-token.sh

      - name: Check out the review repository
        uses: actions/checkout@v7.0.1
        with:
          repository: ${{ needs.detect.outputs.review_repository }}
          ref: ${{ needs.detect.outputs.review_branch }}
          token: ${{ secrets.TEST_UPSTREAM_TOKEN }}
          path: review

      - name: Commit the bump and push the two branches
        id: branches
        env:
          REVIEW_DIR: review
          PACKAGE: ${{ needs.detect.outputs.package }}
          PACKAGE_PATH: ${{ needs.detect.outputs.package_path }}
          UPSTREAM_REPOSITORY: ${{ needs.detect.outputs.upstream_repository }}
          TARGET_VERSION: ${{ needs.detect.outputs.target }}
          BASE_BRANCH: ${{ needs.detect.outputs.base_branch }}
          UPDATE_BRANCH: ${{ needs.detect.outputs.update_branch }}
          OWNED_MARKER: ${{ runner.temp }}/branches-created
        run: scripts/prepare-branches.sh | tee -a "${GITHUB_OUTPUT}"

      - name: Summary
        env:
          BASE_BRANCH: ${{ needs.detect.outputs.base_branch }}
          UPDATE_BRANCH: ${{ needs.detect.outputs.update_branch }}
          BASE_SHA: ${{ steps.branches.outputs.base_sha }}
          SHA: ${{ steps.branches.outputs.sha }}
        run: |
          {
            echo "### Branches pushed to \`${REVIEW_REPOSITORY}\`"
            echo
            echo "- base: \`${BASE_BRANCH}\` @ \`${BASE_SHA}\`"
            echo "- update: \`${UPDATE_BRANCH}\` @ \`${SHA}\`"
          } | tee -a "${GITHUB_STEP_SUMMARY}"

      # The last step of the job, so that a failure or a cancellation of any
      # step before it is covered. After the first push (the marker) the
      # branches belong to this run: delete them. Without the marker nothing was
      # pushed, and a branch that exists is someone else's: left alone.
      - name: Delete the branches this run created, if it failed
        if: ${{ failure() || cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.TEST_UPSTREAM_TOKEN }}
          BASE_BRANCH: ${{ needs.detect.outputs.base_branch }}
          UPDATE_BRANCH: ${{ needs.detect.outputs.update_branch }}
          OWNED_MARKER: ${{ runner.temp }}/branches-created
        run: |
          if [ -e "${OWNED_MARKER}" ]; then
            scripts/discard-branches.sh
          else
            echo "no branch was pushed by this run: nothing to delete"
          fi

  # The tree of every other line: its packages_branch of openwrt/packages plus
  # the package directory of the bump commit, pushed as a branch of this
  # repository (the base builds repository + ref), one per line, in this one
  # job: the outputs of matrix legs would overwrite each other. Same scripts as
  # upstream-pr.yml. Runs after prepare because it reads the update branch of
  # the review repository. A line that cannot be composed is reported and left
  # out (TOLERATE_FAILURE): it never stops the reference line.
  # `matrix` is what the job `lines` runs: the reference line on the bump
  # commit, every composed line on its overlay commit.
  compose:
    needs: [detect, prepare]
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    outputs:
      matrix: ${{ steps.compose.outputs.matrix }}
      overlays: ${{ steps.compose.outputs.overlays }}
      failed: ${{ steps.compose.outputs.failed }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Check out the base (its lines)
        uses: actions/checkout@v7.0.1
        with:
          repository: wehagy/openwrt-ci
          ref: main
          path: ci-base
          persist-credentials: false

      - name: Overlay the bumped package on the other lines
        id: compose
        env:
          OTHER_LINES: ${{ needs.detect.outputs.others }}
          REFERENCE_LINE: ${{ needs.detect.outputs.reference }}
          REFERENCE_FEED_REPOSITORY: ${{ needs.detect.outputs.review_repository }}
          REFERENCE_FEED_REF: ${{ needs.prepare.outputs.sha }}
          HEAD_SHA: ${{ needs.prepare.outputs.sha }}
          OVERLAY_DIRS: ${{ needs.detect.outputs.package_path }}
          SOURCE_URL: https://github.com/${{ needs.detect.outputs.review_repository }}.git
          SOURCE_REF: refs/heads/${{ needs.detect.outputs.update_branch }}
          SOURCE_LABEL: ${{ needs.detect.outputs.review_repository }}:${{ needs.detect.outputs.update_branch }}
          TARGET_PREFIX: ${{ env.OVERLAY_PREFIX }}
          TOLERATE_FAILURE: "true"
          GH_TOKEN: ${{ github.token }}
        run: scripts/upstream-pr/compose-lines.sh

  # One leg per line (line.yml), all in parallel: build, QEMU test, images. A
  # failed leg does not stop the others (fail-fast: false), and each leg writes
  # its own artifact line-result-<package>-<line>. packages: write because
  # build.yml may rebuild the SDK image (see README.md).
  # tests_path: a missing directory means only the generic test runs.
  # `secrets: inherit` passes the repository secrets, not those of an
  # environment, so TEST_UPSTREAM_TOKEN (environment review) does not reach the
  # tests; test_secrets names the only secret exported to pytest.
  lines:
    needs: [detect, compose]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.compose.outputs.matrix) }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/line.yml
    with:
      line: ${{ matrix.line }}
      package: ${{ needs.detect.outputs.package }}
      feed_repository: ${{ matrix.feed_repository }}
      feed_ref: ${{ matrix.feed_ref }}
      profiles: ${{ needs.detect.outputs.profiles }}
      packages: ${{ needs.detect.outputs.packages }}
      targets: ${{ needs.detect.outputs.targets }}
      memory: ${{ needs.detect.outputs.memory }}
      apk_timeout: ${{ needs.detect.outputs.apk_timeout }}
      services_disabled: ${{ needs.detect.outputs.services_disabled }}
      tests_path: packages/${{ needs.detect.outputs.package }}/tests
      test_secrets: NB_SETUP_KEY
    secrets: inherit

  # Only build.yml reads the feed (test.yml and images.yml use the artifact),
  # but a leg runs build, test and images in one go, so the overlay branches go
  # when every leg is done. It runs on every path (success, failure,
  # cancellation) and also when compose failed after a push; the branch names
  # are fixed (prefix + line), a line with no branch only says so.
  cleanup:
    if: ${{ always() && needs.compose.result != 'skipped' }}
    needs: [detect, compose, lines]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Delete the overlay branches
        env:
          OTHER_LINES: ${{ needs.detect.outputs.others }}
          GH_TOKEN: ${{ github.token }}
        run: |
          status=0
          for line in ${OTHER_LINES}; do
            BRANCH="${OVERLAY_PREFIX}-${line}" scripts/upstream-pr/cleanup.sh || status=1
          done
          exit "${status}"

  # The second job with the token. The reference line passed (build, QEMU test
  # and images all green, by its own result file and by the job list): open the
  # draft pull request, with every other line reported whatever its result.
  # Otherwise: delete the two branches, no pull request.
  # actions: read lets the GITHUB_TOKEN list the jobs and artifacts of this run;
  # the token of the review repository is used only for the final commands.
  publish:
    needs:
      - detect
      - prepare
      - compose
      - lines
      - cleanup
    if: ${{ always() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    environment: review
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        shell: bash
    env:
      REVIEW_REPOSITORY: ${{ needs.detect.outputs.review_repository }}
      BASE_BRANCH: ${{ needs.detect.outputs.base_branch }}
      UPDATE_BRANCH: ${{ needs.detect.outputs.update_branch }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Check the configuration and the token
        env:
          TEST_UPSTREAM_TOKEN: ${{ secrets.TEST_UPSTREAM_TOKEN }}
        run: |
          configured=$(scripts/check-config.sh packages/netbird/config.yml | grep '^review_repository=')
          if [ "${configured}" != "review_repository=${REVIEW_REPOSITORY}" ]; then
            echo "::error::review_repository changed since the detect job"
            exit 1
          fi
          if [ -z "${TEST_UPSTREAM_TOKEN}" ]; then
            echo "::error::the secret TEST_UPSTREAM_TOKEN is not set in the environment review"
            exit 1
          fi

      - name: List the jobs and artifacts of this run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?filter=latest&per_page=100" \
            --jq '.jobs[] | {name, conclusion, html_url, failed_steps: [(.steps // [])[] | select(.conclusion == "failure") | .name]}' >jobs.jsonl
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" \
            --jq '.artifacts[] | {name}' >artifacts.jsonl
          wc -l jobs.jsonl artifacts.jsonl

      # The junit file (results.xml) of every QEMU job is an artifact of this
      # run. The description counts what each suite passed, skipped and failed
      # from them, so a skipped suite is never read as a passed one and a job
      # without a file is named. line-results: the outcome of each line, one
      # artifact per leg of the matrix (line.yml); a line without one is
      # reported as having no result.
      - name: Download the test results
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE: ${{ needs.detect.outputs.package }}
        run: |
          mkdir results line-results
          if ! gh run download "${GITHUB_RUN_ID}" --repo "${GITHUB_REPOSITORY}" --pattern "qemu-${PACKAGE}-*" --dir results; then
            echo "::warning::no test results could be downloaded: the description says so for every target"
          fi
          if ! gh run download "${GITHUB_RUN_ID}" --repo "${GITHUB_REPOSITORY}" --pattern "line-result-${PACKAGE}-*" --dir line-results; then
            echo "::warning::no line result could be downloaded: no line is reported as passed"
          fi
          find results -name results.xml | sort
          find line-results -name result.json | sort

      - name: Look for the package runtime tests
        id: suites
        env:
          PACKAGE: ${{ needs.detect.outputs.package }}
        run: |
          if [ -d "packages/${PACKAGE}/tests" ]; then suites=present; else suites=none; fi
          echo "package_tests=${suites}" | tee -a "${GITHUB_OUTPUT}"

      - name: Build the description
        id: report
        env:
          PACKAGE: ${{ needs.detect.outputs.package }}
          PACKAGE_TESTS: ${{ steps.suites.outputs.package_tests }}
          OLD_VERSION: ${{ needs.detect.outputs.current }}
          NEW_VERSION: ${{ needs.detect.outputs.target }}
          UPSTREAM_REPOSITORY: ${{ needs.detect.outputs.upstream_repository }}
          REVIEW_IS_FORK: ${{ needs.detect.outputs.review_is_fork }}
          BASE_SHA: ${{ needs.prepare.outputs.base_sha }}
          HEAD_SHA: ${{ needs.prepare.outputs.sha }}
          LINES: ${{ needs.detect.outputs.lines }}
          REFERENCE: ${{ needs.detect.outputs.reference }}
          OVERLAYS: ${{ needs.compose.outputs.overlays }}
          PACKAGE_PATH: ${{ needs.detect.outputs.package_path }}
          UPSTREAM_BASE: ${{ needs.detect.outputs.upstream_base }}
          # The names of the secrets the test jobs pass (their test_secrets).
          TEST_SECRETS: NB_SETUP_KEY
        run: |
          python3 -B scripts/report.py \
            --lines "${LINES}" --reference "${REFERENCE}" --overlays "${OVERLAYS}" \
            --overlay-repository "${GITHUB_REPOSITORY}" --overlay-dirs "${PACKAGE_PATH}" \
            --package "${PACKAGE}" --package-tests "${PACKAGE_TESTS}" --old "${OLD_VERSION}" --new "${NEW_VERSION}" \
            --upstream-repository "${UPSTREAM_REPOSITORY}" \
            --review-repository "${REVIEW_REPOSITORY}" --review-is-fork "${REVIEW_IS_FORK}" \
            --base-branch "${BASE_BRANCH}" --update-branch "${UPDATE_BRANCH}" \
            --base-sha "${BASE_SHA}" --head-sha "${HEAD_SHA}" \
            --run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --upstream-base "${UPSTREAM_BASE}" --test-secrets "${TEST_SECRETS}" \
            --jobs jobs.jsonl --artifacts artifacts.jsonl --results results --line-results line-results --out body.md | tee -a "${GITHUB_OUTPUT}"
          cat body.md >>"${GITHUB_STEP_SUMMARY}"

      # Both views must agree: the result file of the reference line (the
      # artifact of its leg: build, test and images) and the job list the
      # description was built from. The commit the base reports having built
      # (feed_sha, in each result file) must be the one this run made for the
      # line: the bump commit on the reference line, the overlay commit on the
      # others (which do not decide whether the pull request opens, but are
      # never reported wrong). No `needs.<job>.result` here: for a matrix it is
      # one aggregate for all the lines.
      - name: Decide
        id: decide
        env:
          PACKAGE: ${{ needs.detect.outputs.package }}
          LINES: ${{ needs.detect.outputs.lines }}
          REFERENCE: ${{ needs.detect.outputs.reference }}
          RESULTS_DIR: line-results
          MATRIX: ${{ needs.compose.outputs.matrix }}
          REPORT_PASSED: ${{ steps.report.outputs.reference_passed }}
        run: scripts/decide.sh | tee -a "${GITHUB_OUTPUT}"

      - name: Open the draft pull request
        id: open_pr
        if: ${{ steps.decide.outputs.open == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.TEST_UPSTREAM_TOKEN }}
          PR_TITLE: "${{ needs.detect.outputs.package }}: update to ${{ needs.detect.outputs.target }}"
          PR_BODY_FILE: body.md
        run: |
          url=$(scripts/open-pr.sh)
          echo "pull request: ${url}"
          echo "### Pull request" >>"${GITHUB_STEP_SUMMARY}"
          echo "${url}" >>"${GITHUB_STEP_SUMMARY}"

      # Every way out except an opened pull request ends here: the reference line did
      # not pass, the description or the decision failed, the pull request
      # could not be opened, the run was cancelled. always() makes it run in all
      # of them; discard-branches.sh itself leaves alone the branches of an open
      # pull request. A forced cancellation or a lost runner cannot run this:
      # the next `detect` then fails on the orphan branches (README.md).
      - name: Delete the two branches unless a pull request was opened
        if: ${{ always() && steps.open_pr.outcome != 'success' }}
        env:
          GH_TOKEN: ${{ secrets.TEST_UPSTREAM_TOKEN }}
        run: |
          scripts/discard-branches.sh | tee -a "${GITHUB_STEP_SUMMARY}"
          echo "::notice::this run opened no pull request; the branches of ${UPDATE_BRANCH} are handled as printed above"
