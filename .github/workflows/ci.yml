# Calls the reusable base wehagy/openwrt-ci for every package of this
# repository (packages/<name>/config.yml): build every line of the package
# (`lines:` of its config.yml), test each build in QEMU, build its images. The
# lines run in parallel, one leg of a matrix each (line.yml); no line is named
# here. Runs on push to feature branches and by hand.
#
# The workflows and the scripts both come from the same ref of the base
# (`@<ref>` and ci_ref: <ref> must stay equal); the ref is main.
#
# What is built, tested and imaged comes from packages/netbird/config.yml (read
# by scripts/images/config.sh): the profiles and packages of the images and,
# when set, the test targets and VM memory. The base defaults apply to what the
# file does not say.
name: ci

on:
  push:
    branches: ["feat/**"]
  workflow_dispatch:
    inputs:
      refresh_sdk:
        description: Rebuild the SDK images of the selected lines even when fresh
        type: boolean
        default: false
      lines:
        description: Lines to build, separated by spaces (empty - every line of the package)
        type: string
        default: ""

permissions:
  contents: read

jobs:
  # packages/netbird/config.yml is the one place with the package name, its
  # lines, the image profiles and packages, and the test targets and memory.
  config:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      package: ${{ steps.read.outputs.package }}
      lines_json: ${{ steps.read.outputs.lines_json }}
      profiles: ${{ steps.read.outputs.profiles }}
      packages: ${{ steps.read.outputs.packages }}
      targets: ${{ steps.read.outputs.targets }}
      memory: ${{ steps.read.outputs.memory }}
      apk_timeout: ${{ steps.read.outputs.apk_timeout }}
      services_disabled: ${{ steps.read.outputs.services_disabled }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # The lines of the base (harness/lines.yml): a line of the config that
      # the base does not have fails here, before any build.
      - name: Check out the base (its lines)
        uses: actions/checkout@v7.0.1
        with:
          repository: wehagy/openwrt-ci
          ref: main
          path: ci-base
          persist-credentials: false

      - name: Self-test the configuration scripts
        run: |
          scripts/images/selftest.sh
          scripts/workflow-selftest.sh

      - name: Read packages/netbird/config.yml
        id: read
        env:
          SELECT_LINES: ${{ inputs.lines }}
        run: scripts/images/config.sh netbird | tee -a "${GITHUB_OUTPUT}"

  # One leg per line, all in parallel, each build -> test -> image (line.yml).
  # packages: write because build.yml pushes the SDK images to GHCR when it has
  # to rebuild them (and Manage Actions access of this repository on the package
  # ghcr.io/wehagy/openwrt-sdk). tests_path: a missing directory means only the
  # generic test runs. secrets: inherit + test_secrets: the named secrets reach
  # only the tests. A failed leg does not stop the others (fail-fast: false).
  lines:
    needs: config
    strategy:
      fail-fast: false
      matrix:
        line: ${{ fromJSON(needs.config.outputs.lines_json) }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/line.yml
    with:
      line: ${{ matrix.line }}
      package: ${{ needs.config.outputs.package }}
      refresh_sdk: ${{ inputs.refresh_sdk == true }}
      profiles: ${{ needs.config.outputs.profiles }}
      packages: ${{ needs.config.outputs.packages }}
      targets: ${{ needs.config.outputs.targets }}
      memory: ${{ needs.config.outputs.memory }}
      apk_timeout: ${{ needs.config.outputs.apk_timeout }}
      services_disabled: ${{ needs.config.outputs.services_disabled }}
      tests_path: packages/${{ needs.config.outputs.package }}/tests
      test_secrets: NB_SETUP_KEY
    secrets: inherit

  # The result of every line, from the artifacts of the legs (the `needs` of a
  # matrix job is one aggregate).
  summary:
    if: ${{ always() && needs.config.result == 'success' }}
    needs: [config, lines]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8.0.2
        continue-on-error: true
        with:
          pattern: line-result-*
          path: line-results

      - name: Result of each line
        run: |
          mkdir -p line-results
          {
            echo "### lines"
            echo
            scripts/line-summary.sh line-results
          } | tee -a "${GITHUB_STEP_SUMMARY}"
